{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ShopLite{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{% url 'home' %}">Shop<span>Lite</span></a>
  <nav>
    <a href="{% url 'home' %}">Home</a>
    <a href="#products">Products</a>
    <button id="cartButton" class="cart-btn">Cart <b id="cartCount">0</b></button>
  </nav>
</header>

<main>{% block content %}{% endblock %}</main>

<div id="cartPanel" class="cart-panel" aria-hidden="true">
  <div class="cart-head">
    <h2>Your Cart</h2><button id="closeCart" class="icon-btn">×</button>
  </div>
  <div id="cartItems"></div>
  <div class="cart-total"><span>Total</span><strong id="cartTotal">₹0</strong></div>
  <button id="checkoutBtn" class="primary full">Checkout</button>
</div>
<div id="overlay" class="overlay"></div>

<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
